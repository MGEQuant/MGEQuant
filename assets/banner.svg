<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="8 tools built and tracked in the open. 2 retired after failing their own test. 0 have cleared every evidence test, so far." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070d"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7fb2ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2a44" stroke-width="1"/></pattern>
    <style>
      .s{animation:up .9s ease-out both}.s2{animation-delay:.25s}.s3{animation-delay:.5s}
      @keyframes up{from{opacity:0;transform:translateY(12px)}}
      .z{animation:pulse 2.4s ease-in-out 1.4s infinite alternate}
      @keyframes pulse{to{opacity:.55}}
      @media (prefers-reduced-motion:reduce){.s,.z{animation:none}}
      text{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1280" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="260" rx="18" fill="url(#grid)" opacity=".4"/>
  <text x="640" y="48" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="5" fill="#7fb2ff">THE SCOREBOARD WE PUBLISH</text>
  <g class="s"><text x="250" y="150" text-anchor="middle" font-size="96" font-weight="800" fill="url(#num)">8</text>
    <text x="250" y="190" text-anchor="middle" font-size="19" fill="#c9d4e5">tools built and tracked</text><text x="250" y="214" text-anchor="middle" font-size="19" fill="#c9d4e5">in the open</text></g>
  <line x1="450" y1="80" x2="450" y2="210" stroke="#1d2a44" stroke-width="2"/>
  <g class="s s2"><text x="640" y="150" text-anchor="middle" font-size="96" font-weight="800" fill="#e5484d">2</text>
    <text x="640" y="190" text-anchor="middle" font-size="19" fill="#c9d4e5">retired after failing</text><text x="640" y="214" text-anchor="middle" font-size="19" fill="#c9d4e5">their own test</text></g>
  <line x1="830" y1="80" x2="830" y2="210" stroke="#1d2a44" stroke-width="2"/>
  <g class="s s3"><text class="z" x="1030" y="150" text-anchor="middle" font-size="96" font-weight="800" fill="url(#num)">0</text>
    <text x="1030" y="190" text-anchor="middle" font-size="19" fill="#c9d4e5">have cleared every</text><text x="1030" y="214" text-anchor="middle" font-size="19" fill="#c9d4e5">evidence test — so far</text></g>
</svg>
