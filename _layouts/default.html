<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | MGEQuant{% else %}MGEQuant{% endif %}</title>
<meta name="description" content="Building smarter trading solutions in public. Data. Structure. Execution.">
<link rel="icon" href="/assets/img/mgequant-logo.png">
<style>
  :root {
    --bg: #06070a;
    --bg-panel: #0d0f14;
    --border: #1e222b;
    --silver: #e6e8ec;
    --silver-dim: #9aa0ab;
    --blue: #3b8bff;
    --blue-dim: #6fa8ff;
    --text: #c7cbd4;
    --text-dim: #7d8390;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .topbar {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 24px 0;
  }
  .topbar a {
    color: var(--blue-dim);
    text-decoration: none;
    font-size: 0.92rem;
    border-bottom: 1px solid rgba(111, 168, 255, 0.25);
  }
  .topbar a:hover { color: var(--blue); border-bottom-color: var(--blue); }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 24px 80px;
  }
  .wrap h1 {
    color: var(--silver);
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }
  .wrap h2 {
    color: var(--silver);
    font-size: 1.15rem;
    margin-top: 38px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .wrap h3 {
    color: var(--silver-dim);
    font-size: 1rem;
  }
  a { color: var(--blue-dim); text-decoration: none; border-bottom: 1px solid rgba(111, 168, 255, 0.25); }
  a:hover { color: var(--blue); border-bottom-color: var(--blue); }
  ul { padding-left: 20px; }
  li { margin-bottom: 8px; }
  code {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.9em;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }
  .card {
    flex: 1 1 200px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card:hover { border-color: var(--blue); }
  .card a { border-bottom: none; display: block; color: var(--silver); font-weight: 600; margin-bottom: 4px; }
  .card a:hover { color: var(--blue-dim); }
  .card span { color: var(--text-dim); font-size: 0.88rem; }
  footer {
    text-align: center;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer a { color: var(--blue-dim); }
</style>
</head>
<body>
  <div class="topbar">
    <a href="/">&larr; MGEQuant home</a>
  </div>
  <div class="wrap">
    {{ content }}
    <footer>
      Weekly notes: <a href="https://mgequantnotes.substack.com">mgequantnotes.substack.com</a><br>
      Follow along on X: <a href="https://x.com/MGEQuant">@MGEQuant</a>
    </footer>
  </div>
</body>
</html>
