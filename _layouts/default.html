<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | MGEQuant{% else %}MGEQuant{% endif %}</title>
<meta name="description" content="Building smarter trading solutions in public. Data. Structure. Execution.">
<link rel="icon" href="/assets/img/mgequant-logo.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #06070a;
    --bg-panel: #0d0f14;
    --border: #1e222b;
    --silver: #e6e8ec;
    --silver-dim: #9aa0ab;
    --blue: #3b8bff;
    --blue-dim: #6fa8ff;
    --blue-deep: #1e6fff;
    --blue-hi: #8cc6ff;
    --sheen: #dceaff;
    --text: #c7cbd4;
    --text-dim: #7d8390;
    --link-rule: rgba(111, 168, 255, 0.25);
    --chip-a: #3b8bff;
    --chip-b: #7cc4ff;
    --chip-c: #b9d6ff;
    --aurora-a: rgba(59, 139, 255, 0.30);
    --aurora-b: rgba(111, 168, 255, 0.20);
    --aurora-c: rgba(30, 84, 204, 0.30);
    --aurora-d: rgba(110, 92, 255, 0.16);
    --grid-line: rgba(130, 170, 255, 0.05);
    --vignette: rgba(4, 7, 14, 0.55);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --bg-panel: #ffffff;
      --border: #dbe1ec;
      --silver: #161b26;
      --silver-dim: #464f60;
      --blue: #1668dc;
      --blue-dim: #1f66d6;
      --blue-deep: #1153b4;
      --blue-hi: #4d86e8;
      --sheen: #2f6fe0;
      --text: #3b4351;
      --text-dim: #5c6575;
      --link-rule: rgba(22, 104, 220, 0.3);
      --chip-a: #1668dc;
      --chip-b: #1e6fff;
      --chip-c: #4338ca;
      --aurora-a: rgba(59, 139, 255, 0.24);
      --aurora-b: rgba(111, 168, 255, 0.28);
      --aurora-c: rgba(30, 84, 204, 0.20);
      --aurora-d: rgba(110, 92, 255, 0.16);
      --grid-line: rgba(9, 22, 46, 0.08);
      --vignette: rgba(35, 52, 84, 0.18);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -12%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(52% 40% at 50% -4%, var(--aurora-b), transparent 72%),
      radial-gradient(44% 36% at 14% 14%, var(--aurora-a), transparent 70%),
      radial-gradient(40% 32% at 86% 10%, var(--aurora-a), transparent 72%),
      radial-gradient(52% 42% at 50% 104%, var(--aurora-c), transparent 74%),
      radial-gradient(34% 30% at 72% 58%, var(--aurora-d), transparent 76%),
      radial-gradient(30% 26% at 10% 82%, var(--aurora-b), transparent 74%);
    animation: glow-drift 16s ease-in-out infinite alternate;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      radial-gradient(130% 100% at 50% 38%, transparent 52%, var(--vignette) 100%);
    background-size: 46px 46px, 46px 46px, 100% 100%;
  }
  @keyframes glow-drift {
    from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.7; }
    to { transform: translate3d(0, 26px, 0) scale(1.05); opacity: 1; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  .site-nav {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 18px;
    animation: rise 0.5s ease both;
  }
  .site-nav .brand {
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--silver);
    border-bottom: none;
    margin-right: auto;
  }
  .site-nav .brand:hover { color: var(--blue-dim); }
  .site-nav .brand .brand-back {
    display: inline-block;
    margin-right: 0.25em;
    color: var(--blue);
    transition: transform 0.18s ease;
  }
  .site-nav .brand:hover .brand-back { transform: translateX(-0.2em); }
  .site-nav .brand::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--blue);
    margin-right: 8px;
    animation: brand-live 2.4s ease-in-out infinite;
  }
  @keyframes brand-live {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 3px rgba(59, 139, 255, 0.5); }
    50% { opacity: 1; box-shadow: 0 0 9px rgba(111, 168, 255, 0.95); }
  }
  .site-nav a:not(.brand) {
    color: var(--text-dim);
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    padding-bottom: 3px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .site-nav a:not(.brand):hover { color: var(--blue-dim); }
  .site-nav a.active { color: var(--silver); border-bottom-color: var(--blue); }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 16px 24px 80px;
    animation: rise 0.55s 0.08s ease both;
  }
  .wrap h1 {
    color: var(--silver);
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }
  .wrap h2 {
    color: var(--silver);
    font-size: 1.15rem;
    margin-top: 38px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .wrap h3 {
    color: var(--silver-dim);
    font-size: 1rem;
  }
  a { color: var(--blue-dim); text-decoration: none; border-bottom: 1px solid var(--link-rule); }
  a:hover { color: var(--blue); border-bottom-color: var(--blue); }
  ul { padding-left: 20px; }
  li { margin-bottom: 8px; }
  code {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.9em;
  }
  .card-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
  }
  .card {
    flex: 1 1 200px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .card:hover {
    border-color: var(--blue);
    transform: translateY(-3px);
    box-shadow: 0 12px 28px -16px rgba(59, 139, 255, 0.45);
  }
  .card a { border-bottom: none; display: block; color: var(--silver); font-weight: 600; margin-bottom: 4px; }
  .card a:hover { color: var(--blue-dim); }
  .card span { color: var(--text-dim); font-size: 0.88rem; }
  .log-list { list-style: none; padding: 0; }
  .log-list li {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }
  .log-list li:last-child { border-bottom: none; }
  .log-list a { font-weight: 600; }
  .log-list time {
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    margin-left: auto;
  }
  .shot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px;
    margin-top: 18px;
  }
  .shot {
    display: block;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-panel);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .shot img {
    display: block;
    width: 100%;
    height: 150px;
    object-fit: cover;
    object-position: center;
    transition: transform 0.3s ease;
  }
  .shot .shot-cap {
    display: block;
    padding: 8px 10px;
    font-size: 0.8rem;
    color: var(--text-dim);
    transition: color 0.15s ease;
  }
  .shot:hover {
    transform: translateY(-3px);
    border-color: var(--blue);
    box-shadow: 0 12px 28px -16px rgba(59, 139, 255, 0.45);
  }
  .shot:hover img { transform: scale(1.06); }
  .shot:hover .shot-cap { color: var(--blue-dim); }

  /* ---------- chart lightbox (tiny blue arrow, no-JS safe) ---------- */
  .shotview { position: relative; width: fit-content; max-width: 96vw; max-height: 92vh; margin: auto; padding: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--bg); color: var(--text); isolation: isolate; }
  .shotview::backdrop { background: rgba(4, 7, 14, 0.9); }
  .shotview[open] { display: flex; flex-direction: column; }
  .shotview::before { content: ""; position: absolute; inset: -60px; z-index: 0; pointer-events: none; background: radial-gradient(44% 36% at 20% 20%, var(--aurora-a), transparent 70%), radial-gradient(40% 32% at 82% 16%, var(--aurora-a), transparent 72%), radial-gradient(52% 42% at 50% 104%, var(--aurora-c), transparent 74%), radial-gradient(34% 30% at 74% 60%, var(--aurora-d), transparent 76%); animation: shotview-drift 14s ease-in-out infinite alternate; }
  @keyframes shotview-drift { from { transform: translate3d(0, 0, 0) scale(1); opacity: 0.7; } to { transform: translate3d(0, 22px, 0) scale(1.05); opacity: 1; } }
  .shotview-scroll, .shotview-bar { position: relative; z-index: 1; }
  .shotview-back { position: absolute; top: 12px; left: 12px; z-index: 2; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 50%; background: rgba(6, 7, 10, 0.8); color: var(--blue-dim); font: inherit; font-size: 0.9rem; line-height: 1; text-decoration: none; cursor: pointer; }
  .shotview-back:hover { border-color: var(--blue); color: var(--blue-hi); background: rgba(6, 7, 10, 0.95); }
  .shotview-back:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .shotview-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 50%; background: rgba(6, 7, 10, 0.8); color: var(--blue-dim); font: inherit; font-size: 0.9rem; line-height: 1; text-decoration: none; cursor: pointer; padding: 0; }
  .shotview-nav:hover { border-color: var(--blue); color: var(--blue-hi); background: rgba(6, 7, 10, 0.95); }
  .shotview-nav:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .shotview-prev { left: 12px; }
  .shotview-next { right: 12px; }
  .shotview-scroll { flex: 0 1 auto; min-height: 0; min-width: 0; max-width: 100%; max-height: 100%; overflow: auto; margin: 0 auto; background: #0b0d12; }
  .shotview-img { display: block; width: auto; max-width: none; height: auto; max-height: none; margin: 0 auto; padding: 16px; background: #0b0d12; }
  .shotview-bar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 8px 16px; background: var(--bg-panel); }
  .shotview-cap { flex: 1 1 200px; min-width: 0; color: var(--text-dim); font-size: 0.82rem; line-height: 1.45; }
  .shotview-cap b, .shotview-cap span { display: block; }
  .shotview-cap b { margin-bottom: 3px; color: var(--silver); font-size: 0.88rem; }
  footer {
    text-align: center;
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  footer a { color: var(--blue-dim); }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }
  @supports (animation-timeline: view()) {
    @media (prefers-reduced-motion: no-preference) {
      .wrap > * {
        animation: reveal linear both;
        animation-timeline: view();
        animation-range: entry 0% entry 100%;
      }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
{% if page.url contains "/Mission" %}
<style>
/* Mission & Vision: on-brand dark panels, matching the rest of the site (no parchment).
   Replaced 2026-09-26: the old copy named two retired tools as if still active and the old
   wording ("there is an edge", "when the opportunity has matured") read as a performance
   promise, against the site's own "no performance promises" stance. */
.mv-lead { margin: 6px 0 0; color: var(--text-dim); font-size: 1rem; }
.mv-panel {
  position: relative;
  margin: 28px 0;
  padding: 30px 34px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 14px;
}
.mv-eyebrow {
  display: block;
  margin-bottom: 10px;
  color: var(--blue-dim);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.mv-open {
  margin: 0 0 16px;
  color: var(--silver);
  font-size: clamp(1.15rem, 2.2vw, 1.4rem);
  font-weight: 600;
  line-height: 1.4;
}
.mv-panel p { margin: 0 0 14px; color: var(--text); font-size: 0.98rem; line-height: 1.7; }
.mv-panel p:last-of-type { margin-bottom: 0; }
.stat-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
.stat { flex: 1 1 160px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: rgba(59, 139, 255, 0.04); }
.stat .v { color: var(--silver); font-size: 1.3rem; font-weight: 700; }
.stat .k { margin-top: 2px; color: var(--text-dim); font-size: 0.78rem; }
</style>

<link rel="stylesheet" href="/assets/css/faq-bot.css">
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="/"><span class="brand-back" aria-hidden="true">&larr;</span>MGEQuant</a>
    <a href="/DevelopmentLogs/"{% if page.url contains "/DevelopmentLogs" %} class="active"{% endif %}>Dev logs</a>
    <a href="/Screenshots/"{% if page.url contains "/Screenshots" %} class="active"{% endif %}>Screenshots</a>
    <a href="/Mission%20and%20Vision/"{% if page.url contains "/Mission" %} class="active"{% endif %}>Mission</a>
    <a href="/mgequant-propfirm-calculator.html"{% if page.url contains "calculator" %} class="active"{% endif %}>Calculator</a>
  </nav>
  <div class="wrap">
    {{ content }}
    <footer>
      Weekly notes: <a href="https://mgequantnotes.substack.com" target="_blank" rel="noopener noreferrer">mgequantnotes.substack.com</a><br>
      Follow along on X: <a href="https://x.com/MGEQuant" target="_blank" rel="noopener noreferrer">@MGEQuant</a><br>
      All links: <a href="https://linktr.ee/mgequant" target="_blank" rel="noopener noreferrer">linktr.ee/mgequant</a><br>
      GitHub: <a href="https://github.com/MGEQuant" target="_blank" rel="noopener noreferrer">github.com/MGEQuant</a>
    </footer>
  </div>

  <dialog class="shotview" id="shotview" aria-label="Chart capture">
    <div class="shotview-scroll">
      <img class="shotview-img" alt="">
    </div>
    <div class="shotview-bar">
      <span class="shotview-cap" data-cap></span>
    </div>
    <button class="shotview-back" type="button" data-close aria-label="Back to charts">&larr;</button>
    <button class="shotview-nav shotview-prev" type="button" data-step="-1" aria-label="Previous chart">&lsaquo;</button>
    <button class="shotview-nav shotview-next" type="button" data-step="1" aria-label="Next chart">&rsaquo;</button>
  </dialog>

  <script>
    (function () {
      var dlg = document.getElementById('shotview');
      if (!dlg || typeof dlg.showModal !== 'function') return;
      var img = dlg.querySelector('.shotview-img');
      var cap = dlg.querySelector('[data-cap]');
      var back = dlg.querySelector('.shotview-back');
      var prev = dlg.querySelector('.shotview-prev');
      var next = dlg.querySelector('.shotview-next');
      var last = null;
      var shots = Array.prototype.slice.call(document.querySelectorAll('a.shot'));
      function fill(a) {
        last = a;
        img.src = a.getAttribute('href');
        var thumb = a.querySelector('img');
        img.alt = thumb ? thumb.getAttribute('alt') || '' : '';
        cap.textContent = '';
        var label = a.querySelector('figcaption, .shot-cap');
        if (label) {
          var b = label.querySelector('b');
          var clone = label.cloneNode(true);
          var drop = clone.querySelectorAll('.fired, b');
          for (var i = 0; i < drop.length; i++) drop[i].parentNode.removeChild(drop[i]);
          var desc = clone.textContent.replace(/\s+/g, ' ').trim();
          if (b) { var t = document.createElement('b'); t.textContent = b.textContent.trim(); cap.appendChild(t); }
          if (desc) { var d = document.createElement('span'); d.textContent = desc; cap.appendChild(d); }
        }
      }
      function step(dir) {
        if (!shots.length) return;
        var i = shots.indexOf(last);
        var n = (i + dir + shots.length) % shots.length;
        fill(shots[n]);
      }
      shots.forEach(function (a) {
        a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
          var href = a.getAttribute('href');
          if (!href) return;
          e.preventDefault();
          fill(a);
          document.documentElement.style.overflow = 'hidden';
          dlg.showModal();
          back.focus();
        });
      });
      dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
      dlg.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        step(e.key === 'ArrowLeft' ? -1 : 1);
      });
      if (prev) prev.addEventListener('click', function () { step(-1); });
      if (next) next.addEventListener('click', function () { step(1); });
      back.addEventListener('click', function () { dlg.close(); });
      dlg.addEventListener('close', function () {
        document.documentElement.style.overflow = '';
        img.removeAttribute('src');
        if (last) { last.focus(); last = null; }
      });
    })();
  </script>
<script src="/assets/js/faq-bot.js" defer></script>
</body>
</html>
